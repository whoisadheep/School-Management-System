name: Build Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip the output
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath SchoolManagementSystem_Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: SchoolManagementSystem-Windows-Build
          path: SchoolManagementSystem_Windows.zip
