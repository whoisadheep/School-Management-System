name: Auto-Release Windows App

on:
  push:
    paths:
      - 'version.json' # Triggers only when version.json is updated
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Read version from version.json
        id: get_version
        run: |
          $json = Get-Content version.json | ConvertFrom-Json
          $version = $json.latest_version
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "CHANGELOG=$($json.changelog)" >> $env:GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build Inno Setup Installer
        run: |
          # Use Inno Setup command line compiler to build the installer.iss script
          iscc installer.iss

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: ${{ env.CHANGELOG }}
          files: build/windows/installer/SchoolManagementSystem-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
