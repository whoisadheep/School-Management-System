name: Auto-Release Windows App

on:
  push:
    paths:
      - 'version.json' # Triggers only when version.json is updated
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Read version from version.json
        id: get_version
        run: |
          $json = Get-Content version.json | ConvertFrom-Json
          $version = $json.latest_version
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "CHANGELOG=$($json.changelog)" >> $env:GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create empty .env file
        run: New-Item -Path .env -ItemType File

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle Visual C++ Redistributable and Runtime DLLs
        run: |
          # 1. Download official Visual C++ 2015-2022 Redistributable for Inno Setup bundling
          if (-not (Test-Path "windows\redist")) { New-Item -ItemType Directory -Path "windows\redist" }
          curl.exe -sL "https://aka.ms/vs/17/release/vc_redist.x64.exe" -o "windows\redist\vc_redist.x64.exe"

          # 2. Copy MSVCP140 and VCRUNTIME140 DLLs to application release folder for app-local fallback
          Copy-Item -Path "C:\Windows\System32\msvcp140*.dll" -Destination "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue
          Copy-Item -Path "C:\Windows\System32\vcruntime140*.dll" -Destination "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue
          Copy-Item -Path "C:\Windows\System32\vcomp140*.dll" -Destination "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue

      - name: Build Inno Setup Installer
        run: |
          # Use Inno Setup command line compiler to build the installer.iss script
          iscc installer.iss

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: ${{ env.CHANGELOG }}
          files: build/windows/installer/Eduvia-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
