name: school_management_system
description: School Management System - Admin & Accounting Module
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3
  intl: ^0.19.0
  uuid: ^4.3.3
  fl_chart: ^0.66.2
  google_fonts: ^6.1.0
  data_table_2: ^2.5.10
  file_picker: ^8.0.0
  pdf: ^3.10.8
  printing: ^5.11.1
  crypto: ^3.0.3
  encrypt: ^5.0.3
  pointycastle: ^3.7.3
  device_info_plus: ^9.1.1
  package_info_plus: ^9.0.1
  dio: ^5.11.0
  bcrypt: ^1.2.0
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.2
  flutter_dotenv: ^5.1.0
  sqflite_common_ffi_web: ^1.0.1+1
  csv: ^8.0.0
  excel: ^4.0.6
  # google_generative_ai removed; API calls are now proxied server-side

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
